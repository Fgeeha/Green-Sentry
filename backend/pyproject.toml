[project]
name = "GreenSentry"
version = "0.1.0"
description = "Plant disease diagnosis with reasoning component"
authors = [
    {name = "nkolesnikov",email = "33605615+Fgeeha@users.noreply.github.com"}
]
package-mode = false
packages = [
    { include = "app", from = "backend" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.120.2,<0.121.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pydantic (>=2.12.3,<3.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "torch (>=2.9.0,<3.0.0)",
    "torchvision (>=0.24.0,<0.25.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "numpy (>=2.2.2,<3.0.0)",
    "opencv-python (>=4.12.0.88,<5.0.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "gigachat (>=0.1.42.post2,<0.2.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "alembic (>=1.17.1,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "redis (>=7.0.1,<8.0.0)",
    "celery (>=5.5.3,<6.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "prometheus-client (>=0.23.1,<0.24.0)",
    "sentry-sdk[fastapi] (>=2.43.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "ruff (>=0.14.2,<0.15.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-watch (>=4.2.0,<5.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "faker (>=37.12.0,<38.0.0)",
    "bandit (>=1.8.6,<2.0.0)",
    "safety (>=3.6.2,<4.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pdoc (>=16.0.0,<17.0.0)"
]


[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?'
extend-exclude = '''
/(
  | dist
  | .eggs
  | .git
  | .venv
  | alembic/versions
)/
'''

[tool.ruff]
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = ["E501", "B008", "C901"]
exclude = [
    ".git",
    "__pycache__",
    "dist",
    ".venv",
    "alembic/versions",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "cv2.*",
    "gigachat.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]